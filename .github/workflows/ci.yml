name: ci

# The offline surface only. Everything here runs on a clean windows-latest
# runner with no SolidWorks install, so a red build means the code is wrong
# rather than the machine being different. The tests that drive a real
# SolidWorks session (drive-tools, output-contract, verify-active,
# rebuild-via-plugin, promote-thread-recipe, recipes, recipe-candidates,
# recipe-output-contract) deliberately stay manual.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    name: node ${{ matrix.node }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The plugin has no dependencies by design: it is plain ESM plus two
      # bundled .vbs assets. If a dependency is ever added, this is the guard
      # that forces the decision to be deliberate.
      - name: Assert no runtime dependencies
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $names = @()
          if ($pkg.PSObject.Properties.Name -contains 'dependencies') {
            $names = @($pkg.dependencies.PSObject.Properties.Name)
          }
          if ($names.Count -gt 0) {
            Write-Error "the plugin is supposed to stay dependency-free, found: $($names -join ', ')"
          }
          Write-Host 'dependencies: none'

      - name: Syntax check every module
        shell: pwsh
        run: |
          $failed = 0
          Get-ChildItem lib, test -Include *.js, *.mjs -Recurse | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { Write-Host "FAIL $($_.Name)"; $failed++ }
          }
          if ($failed -gt 0) { exit 1 }

      # Each test file checks its own assertions and exits non-zero on failure.
      - name: Offline tests
        shell: pwsh
        run: |
          $failed = 0
          foreach ($t in @('load-compat', 'schema-guard', 'routing-advice', 'capability-cache', 'error-codes')) {
            Write-Host "=== $t ==="
            node "test/$t.mjs"
            if ($LASTEXITCODE -ne 0) { Write-Host "FAILED: $t"; $failed++ }
          }
          if ($failed -gt 0) { exit 1 }
